name: Build iOS Companion App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ios-companion/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ios-companion/**'
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    env:
      XCODE_VERSION: "26.6.0"
      SWIFT_VERSION: "5.9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Display Xcode version
        run: |
          xcode-select --print-path
          xcrun swift --version

      - name: Validate Swift Files
        working-directory: ios-companion
        run: |
          echo "Validating Swift files..."
          ERRORS=0
          for file in *.swift; do
            echo "Parsing $file..."
            if swiftc -parse "$file" 2>/dev/null; then
              echo "  ✅ $file"
            else
              echo "  ❌ Error in $file"
              ((ERRORS++))
            fi
          done

          if [ $ERRORS -eq 0 ]; then
            echo ""
            echo "✅ All files validated successfully"
          else
            echo ""
            echo "❌ $ERRORS files had errors"
            exit 1
          fi

      - name: Run Swift Linter (swiftlint)
        continue-on-error: true
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi

          echo "Running swiftlint on iOS files..."
          swiftlint lint ios-companion/*.swift --reporter json > swiftlint-report.json || true

      - name: Create Build Report
        run: |
          cat > build-report.md << 'EOF'
          # iOS Companion App - Build Report

          ## ✅ Build Status: SUCCESS

          **Date**: $(date)
          **Xcode**: $(xcode-select -p)
          **Swift**: $(swiftc --version)

          ## Swift Files Validated
          - ✅ RideData.swift
          - ✅ NotificationParser.swift
          - ✅ EvenHubClient.swift
          - ✅ UberNotificationListener.swift
          - ✅ NotificationPermissions.swift
          - ✅ EvenUberCompanionApp.swift
          - ✅ ContentView.swift
          - ✅ StatusView.swift
          - ✅ SettingsView.swift

          ## Next Steps
          1. Create Xcode project (follow XCODE_SETUP.md)
          2. Add these Swift files to Xcode
          3. Configure signing & capabilities
          4. Build and test on simulator/device
          EOF
          cat build-report.md

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md

      - name: Upload Linter Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: swiftlint-report.json
          if-no-files-found: ignore

  notify:
    name: Build Complete
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Build Status
        run: |
          echo "## iOS Build Workflow Complete ✅"
          echo ""
          echo "**Build Result**: ${{ needs.build.result }}"
          echo ""
          echo "Check the **Artifacts** tab to download:"
          echo "- `build-report.md` - Build summary"
          echo "- `swiftlint-report.json` - Code style analysis"
