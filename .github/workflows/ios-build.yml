name: Build iOS Companion App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ios-companion/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ios-companion/**'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS Simulator)
    runs-on: macos-latest

    env:
      PROJECT: ios-companion/EvenUberCompanion.xcodeproj
      SCHEME: EvenUberCompanion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinning an exact version breaks whenever GitHub rotates images.
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcode-select --print-path
          xcodebuild -version
          xcrun swift --version

      - name: Verify project.yml matches the committed project
        run: |
          brew install xcodegen
          cd ios-companion
          xcodegen generate
          if ! git diff --quiet -- EvenUberCompanion.xcodeproj; then
            echo "::warning::EvenUberCompanion.xcodeproj differs from project.yml."
            echo "Run 'cd ios-companion && xcodegen generate' and commit the result."
            git diff --stat -- EvenUberCompanion.xcodeproj
          else
            echo "✅ Project file is in sync with project.yml"
          fi

      - name: Pick a simulator
        id: sim
        run: |
          # Choose the newest available iPhone runtime rather than hardcoding a
          # device name that disappears when GitHub updates the image.
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and d['name'].startswith('iPhone'):
                      if best is None or runtime > best[0]:
                          best = (runtime, d['udid'], d['name'])
          if best is None:
              sys.exit('No available iPhone simulator found')
          print(best[1])
          print(f'Using {best[2]} on {best[0]}', file=sys.stderr)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -A3 "iOS"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run SwiftLint
        continue-on-error: true
        run: |
          brew install swiftlint
          swiftlint lint --reporter github-actions-logging ios-companion || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          {
            echo "## iOS Companion Build"
            echo ""
            echo "- **Xcode**: $(xcodebuild -version | head -1)"
            echo "- **Swift**: $(xcrun swift --version 2>&1 | head -1)"
            echo "- **Simulator**: ${{ steps.sim.outputs.udid }}"
            echo "- **Result**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
